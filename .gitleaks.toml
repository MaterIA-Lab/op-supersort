[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
# prior-local/ was removed from main (see notes/prior-research.md), but the secret
# scan covers the full git history, so these exact digest matches stay allowlisted.
description = "Known source-file SHA-256 checksums in historical experiment metadata"
condition = "AND"
regexTarget = "secret"
paths = [
  '''^prior-local[\\/]results[\\/]e040_quick_holdout_linux[\\/]metadata\.json$''',
  '''^prior-local[\\/]results[\\/]e040_quick_holdout_linux[\\/]quick[\\/]preparation\.json$''',
  '''^prior-local[\\/]results[\\/]e040_quick_sanitizers[\\/]metadata\.json$''',
